.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px; align-items: start; } .grid-2 > .card { margin: 0; }

.note .ic { margin-top: 2px; } .note a { color: inherit; font-weight: 700; }
.err { color: var(--bad); font-weight: 600; }

.empty.small { padding: 22px; } .empty-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-soft-ink); display: grid; place-items: center; margin: 0 auto 12px; }
.empty p { max-width: 460px; margin: 0 auto 12px; color: var(--ink3); }

.wchart { width: 100%; height: auto; } .wchart .bar { fill: var(--accent); } .wchart .gl { stroke: var(--line); stroke-width: 1; } .wchart .ax { font: 500 11px var(--font); fill: var(--ink3); } .wchart .ax.val { fill: var(--ink); font-weight: 700; } .wchart .tline { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; } .wchart .tlab { fill: var(--ink); font-weight: 700; }

/* ---------- grocery ---------- */

.gcols { columns: 2 340px; column-gap: 18px; } .gsec { break-inside: avoid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); }

.gname { font-weight: 600; overflow-wrap: anywhere; } .gamt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink2); white-space: nowrap; } .gitem.done .gname, .gitem.done .gamt { text-decoration: line-through; color: var(--ink3); font-weight: 500; }

.ing-tools { display: grid; gap: 8px; margin-bottom: 8px; } .route { list-style: none; margin: 0; padding: 0; } .route li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); } .route li::before { content: counter(r); }

/* ---------- dialog / toast / tip ---------- */
dialog { border: 0; padding: 0; border-radius: 20px; width: min(520px, 94vw); background: var(--surface); color: var(--ink); box-shadow: 0 24px 80px rgba(0, 0, 0, .35); } dialog.wide { width: min(780px, 96vw); } dialog::backdrop { background: rgba(10, 14, 11, .55); backdrop-filter: blur(2px); }

/* ---------- responsive ---------- */

  .rv { grid-template-columns: minmax(0, 1fr); } .rlist-wrap { position: static; max-height: none; } .rv.has-detail .rlist-wrap { display: none; } .rv:not(.has-detail) .rdetail-wrap { display: none; } .backbtn { display: inline-flex; }
  .rd-cols { grid-template-columns: 1fr; }

  .prow { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; } .prow > div { padding: 10px 14px; } .pday { flex-direction: row; align-items: center; background: var(--bg2); } .dayacts { margin-left: auto; }
  .pslot::before, .ptot::before { content: attr(data-label); font-size: .72rem; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); }

}

  .form-grid .span2 { grid-column: span 1; } .summary div { grid-template-columns: 1fr; gap: 2px; } .today li { grid-template-columns: 1fr; } .gitem { grid-template-columns: 1fr auto auto; } .gitem .chip.src { display: none; }
  .gcols { columns: 1; }
}

/* ---------- print ---------- */

  #appbar, footer, .noprint, .backbtn, #toasts, #tip, .rlist-wrap, .rfilters, .page-head .btn, .gtools, .gprog .row, .chips.noprint { display: none !important; }
  body { background: #fff; font-size: 11pt; } main#view { padding: 0; max-width: none; }
  .card, .gsec, .rdetail, .pgrid, .prow { box-shadow: none !important; break-inside: avoid; }
  .rv { display: block; } .rv:not(.has-detail) .rdetail-wrap { display: block; }
  .gcols { columns: 2; } .gitem .btn { display: none; } .gsec h3 { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .prow { grid-template-columns: 90px repeat(var(--cols), 1fr) 150px; } .pslot select { border: 0; appearance: none; padding: 0; } .sv .serv { border: 0; }
}

.chartkey { display: flex; gap: 18px; flex-wrap: wrap; font-size: .8rem; color: var(--ink2); margin: 4px 0 0 40px; } .chartkey span { display: inline-flex; align-items: center; gap: 7px; } .chartkey .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); } .chartkey .dash { width: 20px; border-top: 2px dashed var(--ink); }
.btype .body { width: 56px; height: 112px; }

   Site chrome: header extras, mobile menu, scroll progress, back to top,

   ========================================================================== */

@media (min-width: 721px) { .brand .beta { display: none; } .btn.searchbtn { font-size: 0; gap: 0; padding-inline: 10px; } .btn.searchbtn svg { font-size: 1rem; } }
@media (max-width: 720px) {
  #appbar { flex-wrap: nowrap; gap: 6px; padding-block: 6px; row-gap: 0; }
  #menuBtn { display: inline-flex; flex: none; }

/* =====================================================================

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: var(--r-sm); }

/* --- motion: no lifts, no bounce, no entrance choreography --- */

  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease);
}

.tab.on:hover, .ritem.on:hover, .btype.on:hover, .chipbtn.on:hover, .gcard.on:hover, .feat.on:hover, .btn.on:hover, .seg button.on:hover,
.wchart g:hover .bar, .wchart g:focus .bar, .btn.primary:hover, .linkbtn:hover { filter: none; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :is(.tab, .ritem, .btype, .chipbtn, .gcard, .feat, .btn, .seg button).on:hover { filter: none; } }
.wchart g:hover .bar, .wchart g:focus .bar { fill: var(--accent-hover); }
.linkbtn:hover { color: var(--accent-hover); }
#view.view-in { animation: fadein .12s ease backwards; }
.tiles > * { animation: none; }
.toast { animation: fadein .12s ease; } .toast.out { transition: opacity .15s; }
.notice { animation: fadein .15s ease; }
.done-badge { animation: fadein .15s ease backwards; }
body.menu-open #nav { animation: fadein .12s ease; }
.moremenu .menu { animation: none; }
.clbar span { transition: width .15s ease; }

/* --- header: solid app bar + underline tabs --- */
#appbar { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 1px solid var(--line); box-shadow: var(--shadow); transition: box-shadow var(--ease); }
#appbar.stuck { box-shadow: 0 2px 10px rgba(20, 24, 31, .08); }
.brand { gap: 9px; font-weight: 650; font-size: 14.5px; }
.beta { white-space: nowrap; border-radius: 3px; font-size: 10.5px; font-weight: 650; padding: 1px 6px; }
#progress { height: 2px; }
#progress i { background: var(--accent); border-radius: 0; }
@media (min-width: 721px) {
  #appbar { padding-top: 0; padding-bottom: 0; align-items: stretch; min-height: 52px; }
  .brand, .bar-actions { align-self: center; }
  .brand { min-height: 48px; }
  #nav { padding: 0; gap: 0; align-items: stretch; }
  .tab { position: relative; border-radius: 0; padding: 0 11px; min-height: 48px; font-size: 13.5px; font-weight: 500; color: var(--ink2); background: none; }
  .tab:hover { background: var(--bg2); color: var(--ink); }
  .tab.on, .tab.on:hover { background: none; color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .tab:focus-visible { outline-offset: -2px; border-radius: 0; }
}
@media (max-width: 1140px) and (min-width: 721px) { #nav { border-top: 1px solid var(--line); } }
@media (max-width: 720px) {
  #nav { box-shadow: var(--shadow-pop); border-bottom-color: var(--line2); padding: 6px 8px 10px; }
  #nav .tab { border-radius: var(--r-sm); font-size: 15px; font-weight: 500; }
  #nav .tab.on, #nav .tab.on:hover { background: var(--accent-soft); color: var(--accent-soft-ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  body.menu-open::before { background: rgba(10, 12, 16, .4); }
}

/* --- page structure --- */
main#view { padding-top: 20px; padding-bottom: 48px; }
.page-head { margin-bottom: 14px; }
.page-head p { font-size: 13.5px; }
footer { font-size: 12px; background: var(--surface); }

/* --- buttons --- */
.btn { border-radius: var(--r-sm); min-height: var(--ctl); padding: 0 14px; font: 550 13.5px var(--font); border-color: var(--line2); background: var(--surface); color: var(--ink); box-shadow: none; }
.btn:hover { background: var(--bg2); border-color: color-mix(in srgb, var(--ink) 30%, var(--line2)); }
.btn:active { background: var(--bg3); }
.btn.sm { min-height: var(--ctl-sm); padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.btn.icon { width: var(--ctl); padding: 0; } .btn.icon.sm { width: var(--ctl-sm); }
.btn.big { min-height: 44px; padding: 0 20px; font-size: 14.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.primary:active { filter: brightness(.94); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger:hover { background: color-mix(in srgb, var(--bad) 88%, #000); }
.btn.danger-o { background: var(--surface); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line2)); }
.btn.danger-o:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn.ghost, .btn.ghost.dg { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg2); border-color: transparent; }
.btn.ghost.dg:hover { background: var(--bad-bg); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-soft-ink); }
.btn[disabled], .btn[disabled]:hover { opacity: 1; background: var(--bg2); border-color: var(--line); color: var(--ink3); cursor: not-allowed; }
.btn.primary[disabled], .btn.primary[disabled]:hover { background: color-mix(in srgb, var(--accent) 35%, var(--bg2)); border-color: transparent; color: color-mix(in srgb, var(--accent-ink) 85%, transparent); }
.btn.left { border-radius: var(--r-sm); }
.toast .tundo { border-radius: var(--r-sm); min-height: 32px; }

/* toggle chips & segmented controls */
.chip { border-radius: 3px; font-size: 11.5px; font-weight: 600; padding: 2px 7px; }
.chip.src { border-color: var(--line2); }
.chipbtn { border-radius: var(--r-sm); min-height: var(--ctl-sm); padding: 0 11px; font: 500 13px var(--font); border-color: var(--line2); }
.chipbtn:hover { border-color: var(--accent); color: var(--ink); background: var(--bg2); }
.chipbtn.on, .chipbtn.on:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-soft-ink); font-weight: 600; }
.seg:not(circle) { border-radius: var(--r-sm); padding: 2px; gap: 2px; background: var(--bg2); border-color: var(--line2); }
.seg button { border-radius: 3px; min-height: calc(var(--ctl) - 6px); padding: 0 12px; font: 500 13px var(--font); }
.seg button.on, .seg button.on:hover { background: var(--accent); color: var(--accent-ink); box-shadow: none; font-weight: 600; }

/* --- forms --- */
.fld > span, .fld > legend { font-size: 12.5px; font-weight: 550; }
input, select, textarea { border-radius: var(--r-sm); border-color: var(--line2); padding: 6px 10px; min-height: var(--ctl); font-size: 14px; }
input:hover:not(:focus):not(:disabled), select:hover:not(:focus):not(:disabled), textarea:hover:not(:focus) { border-color: color-mix(in srgb, var(--ink) 35%, var(--line2)); }
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
input::placeholder, textarea::placeholder { color: var(--ink3); opacity: .85; }
.table select, .multi input, .sv .serv { border-radius: var(--r-sm); }
.hint { border-radius: 3px; }
.radio { border-radius: var(--r-sm); border-color: var(--line2); }
.radio:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line2)); }
.radio:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.drop { border-radius: var(--r); border-width: 1px; }
.search .ic { top: 50%; transform: translateY(-50%); }

/* --- cards / panels --- */
.card { border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
.card.soft { background: var(--bg2); }
.card-head h2, details.card summary { font-size: 15px; font-weight: 600; }
.grid-2 { gap: 14px; } .two-col { gap: 16px; } .tiles { gap: 12px; margin-bottom: 16px; }
.tile { border-radius: var(--r); padding: 14px 16px; }
.tile:hover { border-color: var(--accent-line); background: var(--bg2); }
.tile small { font-size: 11.5px; font-weight: 600; }
.tile b { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
.tile span { font-size: 12.5px; }
.kpi { border-radius: var(--r); background: var(--bg2); }
.kpi small { font-size: 11px; font-weight: 600; }
.kpi.hero { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.kpi.hero small, .kpi.hero span { color: var(--accent-soft-ink); opacity: 1; }
.note { border-radius: var(--r-sm); font-size: 13.5px; box-shadow: inset 3px 0 0 var(--line2); }
.note.warn { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--warn) 70%, transparent); }
.note.err { box-shadow: inset 3px 0 0 var(--bad); }
.note.ok { box-shadow: inset 3px 0 0 var(--good); }
.note.demo { box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.chip.demo { border-radius: 3px; }
.empty { border-radius: var(--r); background: var(--bg2); padding: 36px 20px; }
.empty-ic { border-radius: var(--r); width: 48px; height: 48px; }
.legal-short { border-radius: var(--r); }
.results { border-color: var(--line); }

/* --- tables & lists --- */
.table { font-size: 13.5px; }
.table thead th, .mtable thead th { font-size: 11px; font-weight: 600; background: var(--bg2); color: var(--ink2); border-bottom: 1px solid var(--line2); }
.table th, .table td { padding: 7px 10px; }
.table tbody tr:hover td { background: var(--hover-band); }
.mtable th, .mtable td { padding: 6px 8px; }
.cbox { border-radius: var(--r-sm); width: 20px; height: 20px; }
.gcheck .box { border-radius: var(--r-sm); }
.gitem:hover { background: var(--hover-band); }
.slot, .phead, .sgroup { font-size: 11px; font-weight: 600; }

/* --- macro bars & progress: flat, squared --- */
.dot { border-radius: 2px; }
.mbar { border-radius: 2px; } .mbar span { border-radius: 1px; }
.wiz-progress i, .gprog .bar, .clbar { border-radius: 2px; }
.gprog .bar span, .clbar span { border-radius: 0; }
.chartkey .swatch { border-radius: 2px; }

/* --- goals / setup wizard --- */
.stepno { border-radius: var(--r-sm); font-weight: 650; }
.btype, .gcard, .feat { border-width: 1px; border-color: var(--line2); border-radius: var(--r); }
.btype:hover, .gcard:hover, .feat:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line2)); background: var(--bg2); }
.btype.on, .gcard.on, .feat.on, .feat.locked,
.btype.on:hover, .gcard.on:hover, .feat.on:hover { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.feat .tick { border-radius: var(--r-sm); }
.wiz-card { border-radius: 8px; }
.done-badge { border-radius: 8px; width: 64px; height: 64px; }
.done-kpis > div { border-radius: var(--r); }
.done-kpis > div:first-child { box-shadow: inset 3px 0 0 var(--accent); }

/* --- recipes --- */
.rlist-wrap, .rdetail { border-radius: var(--r); }
.rfilters { padding: 10px; }
.ritem { padding: 10px 12px; border-left-width: 3px; }
.ritem:hover { background: var(--bg2); }
.ritem.on, .ritem.on:hover { background: var(--accent-soft); }
.rt b { font-size: 14px; font-weight: 600; }
.rd-head h2 { font-size: 22px; font-weight: 650; letter-spacing: -.015em; }
.steps li::marker { font-weight: 650; }

/* --- planner --- */
.target-strip { background: var(--accent-soft); border: 1px solid var(--accent-line); border-left: 3px solid var(--accent); color: var(--ink); padding: 12px 16px; gap: 24px; }
.target-strip small { color: var(--accent-soft-ink); font-size: 11px; font-weight: 600; opacity: 1; }
.pgrid { border-radius: var(--r); }
.prow.today { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.prow.today .pday { box-shadow: inset 3px 0 0 var(--accent); }
.pslot .pick { border-radius: var(--r-sm); }
@media (max-width: 960px) { .prow { border-radius: var(--r); } }

/* --- grocery --- */
.gsec { border-radius: var(--r); }
.gsec h3 { background: var(--bg2); color: var(--ink2); border-bottom: 1px solid var(--line); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; padding: 9px 14px; }

/* --- overlays: dialog, search, menus, toasts --- */
dialog { border-radius: 8px; box-shadow: var(--shadow-pop); border: 1px solid var(--line); }
dialog::backdrop { background: rgba(10, 12, 16, .45); backdrop-filter: none; -webkit-backdrop-filter: none; }
.dlg-body { padding: 20px; }
.dlg-head h3 { font-size: 17px; }
.dlg-actions { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
.sbar { padding: 8px 14px; }
.sitem { border-radius: var(--r-sm); padding: 8px 10px; }
.sitem:hover, .sitem.on { box-shadow: inset 2px 0 0 var(--accent); }
.moremenu .menu { border-radius: var(--r); box-shadow: var(--shadow-pop); padding: 4px; }
.toast { border-radius: var(--r); box-shadow: var(--shadow-pop); font-size: 13.5px; }
#tip { border-radius: var(--r-sm); }
.totop { border-radius: var(--r); width: 40px; height: 40px; box-shadow: var(--shadow-pop); }
.totop:hover { background: var(--bg2); color: var(--ink); border-color: var(--line2); box-shadow: var(--shadow-pop); }
.notice { box-shadow: 0 -4px 16px rgba(20, 24, 31, .1); }
.sk { border-radius: var(--r-sm); }
mark { border-radius: 2px; }

/* keep the original layouts that the .card padding reset above would flatten */
.card.step { padding-left: 64px; } .stepno { left: 16px; top: 16px; }
@media (max-width: 960px) { .card.step { padding-left: 16px; padding-top: 58px; } }
:where(svg).ic { color: inherit; } /* small icons were picking up the search panel's .sm text colour */
.btn.searchbtn, .btn.sm.searchbtn { font-size: 0; gap: 0; padding-inline: 10px; }

/* --- touch & small screens: keep 44px targets, avoid iOS input zoom --- */
@media (pointer: coarse), (max-width: 700px) {
  :root { --ctl: 44px; --ctl-sm: 44px; }
  .seg button { min-height: 44px; }
}
@media (pointer: coarse) { input, select, textarea { font-size: 16px; } }
@media (max-width: 560px) { .card { padding: 14px; } .tile b { font-size: 22px; } }
@media print { .kpi.hero, .note, .target-strip, .prow.today .pday { box-shadow: none; } }

/* =====================================================================
   APP-FAMILY COMPONENTS (BETA 4.2) — shared logo badge, light/dark switch,
   Data menu + "backed up" chip, phone bottom nav. Same markup and sizes as
   the other apps; only --accent differs.
   ===================================================================== */
/* logo badge: --r square, accent fill, white bowl + gold steam (steam falls back to accent-ink in dark, where gold on light blue disappears) */
:root { --logo-steam: #F2B640; }
:root[data-theme="dark"] { --logo-steam: var(--accent-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --logo-steam: var(--accent-ink); } }
.logo { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: var(--r); background: var(--accent); color: var(--accent-ink); vertical-align: middle; }
.logo > svg, :is(.brand, .brandmini, .about-h, .hero-logo, .wiz-top) .logo > svg { width: 64%; height: 64%; display: block; color: inherit; }
.brand .logo, .brand:hover .logo { transform: none; transition: none; }
.hero-logo .logo { border-radius: 8px; }

/* light/dark switch */
.themesw { display: inline-flex; align-items: center; flex: none; padding: 0; border: 0; background: none; cursor: pointer; border-radius: var(--r-sm); color: var(--ink2); }
.themesw .tk { position: relative; display: block; width: 52px; height: 26px; border-radius: var(--r-sm); background: var(--bg3); border: 1px solid var(--line2); transition: background-color var(--ease), border-color var(--ease); }
.themesw .th { position: absolute; left: 2px; top: 2px; width: 22px; height: 20px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform var(--ease); }
.themesw .th .ic { width: 12px; height: 12px; }
.themesw[aria-checked="true"] .th { transform: translateX(24px); }
.themesw:hover .tk { border-color: color-mix(in srgb, var(--ink) 35%, var(--line2)); }
.themesw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header actions share one compact height */
.bar-actions > .btn, .bar-actions > .bk-chip, .datamenu > summary { min-height: var(--ctl-sm); }
#storageBadge { align-self: center; }

/* "backed up" chip */
.bk-chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--ctl-sm); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg2); color: var(--ink2); font: 500 12.5px var(--font); white-space: nowrap; cursor: pointer; transition: background-color var(--ease), border-color var(--ease), color var(--ease); }
.bk-chip:hover { background: var(--bg3); color: var(--ink); border-color: var(--line2); }
.bk-chip.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn-dot) 55%, transparent); }
.bk-chip.warn:hover { border-color: var(--warn-dot); }
.bk-chip[hidden] { display: none; }

/* Data menu (details dropdown) */
.datamenu > summary { gap: 6px; position: relative; }
.datamenu > summary::after { content: ''; width: 7px; height: 7px; margin: -3px 0 0 1px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); opacity: .6; }
.datamenu[open] > summary, .datamenu.on > summary { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-soft-ink); }
.bk-dot { display: none; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 2px; background: var(--warn-dot); box-shadow: 0 0 0 2px var(--surface); }
.moremenu .dm-menu { min-width: 290px; padding: 6px; gap: 2px; }
.dm-menu .btn { justify-content: flex-start; width: 100%; min-height: var(--ctl); }
.dm-menu .btn.primary { margin-bottom: 4px; }
.dm-menu .btn kbd { margin: 0 0 0 auto; background: color-mix(in srgb, var(--accent-ink) 18%, transparent); border-color: color-mix(in srgb, var(--accent-ink) 35%, transparent); color: inherit; }
.dm-foot { margin-top: 4px; padding: 10px 8px 4px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink3); display: grid; gap: 6px; }
.dm-foot p { margin: 0; display: flex; gap: 6px; align-items: flex-start; } .dm-foot p .ic { margin-top: 2px; }
.dm-foot p:first-child { color: var(--ink2); font-weight: 600; } .dm-foot .bk-warn { color: var(--warn) !important; }
.dm-foot b { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.dm-foot .linkbtn { font-size: inherit; padding: 0; }
.dm-more { font-size: 12.5px; }

/* Data page: backup card */
.bk-card { border-left: 3px solid var(--accent); }
.bk-card h2 { display: flex; gap: 8px; align-items: center; }
.bk-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink2); padding: 3px 8px; border-radius: var(--r-sm); background: var(--bg2); border: 1px solid var(--line); }
.bk-status.warn { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn-dot) 55%, transparent); }
.bk-status .muted { font-weight: 500; }
.bk-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.bk-actions kbd { margin: 0 0 0 4px; background: color-mix(in srgb, var(--accent-ink) 18%, transparent); border-color: color-mix(in srgb, var(--accent-ink) 35%, transparent); color: inherit; }
.bk-where { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink2); margin: 0 0 6px; } .bk-where .ic { margin-top: 3px; color: var(--ink3); }
.bk-where b { overflow-wrap: anywhere; }
.bk-extra { margin: 4px 0 0; }
.bk-note { align-items: center; flex-wrap: wrap; } .bk-note > span { flex: 1; min-width: 200px; }
.stack { display: grid; gap: 14px; align-content: start; } .stack > .card, .data-grid > .card { margin: 0; }
.data-grid { margin-bottom: 14px; }
.wiz-look { margin-top: 14px; } .wiz-look .seg button { display: inline-flex; align-items: center; gap: 6px; min-width: 96px; justify-content: center; }

/* quieter tags: neutral outlines instead of extra tints */
.chip.type { background: var(--bg2); color: var(--ink2); border: 1px solid var(--line); }
.chip.prep { background: var(--accent-soft); color: var(--accent-soft-ink); }
.chip.demo { background: transparent; color: var(--ink2); border: 1px dashed var(--line2); font-weight: 600; }
:root[data-theme="dark"] .chip.type, :root[data-theme="dark"] .chip.prep { color: inherit; }
:root[data-theme="dark"] .chip.type { color: var(--ink2); } :root[data-theme="dark"] .chip.prep { color: var(--accent-soft-ink); }

/* phone bottom nav + "More" sheet */
.bnav, .bn-sheet { display: none; }
@media (max-width: 720px) {
  :root { --bnav-h: calc(55px + env(safe-area-inset-bottom)); }
  body[data-view="setup"] { --bnav-h: 0px; }
  body, body.has-notice { padding-bottom: calc(var(--bnav-h, 0px) + var(--notice-h, 0px)); }
  #nav, body.menu-open #nav { display: none !important; }
  .bnav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line2); padding: 0 max(4px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px, env(safe-area-inset-left)); gap: 2px; }
  body[data-view="setup"] .bnav, body[data-view="setup"] .bn-sheet { display: none; }
  .bnav > a, .bnav > button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 6px 2px 4px; border: 0; border-radius: 0; background: none; color: var(--ink2); font: 500 11px var(--font); letter-spacing: -.01em; text-decoration: none; cursor: pointer; transition: background-color var(--ease), color var(--ease); }
  .bnav > a:hover, .bnav > button:hover { background: var(--bg2); color: var(--ink); }
  .bnav > .on, .bnav > .on:hover { color: var(--accent); font-weight: 600; background: none; box-shadow: inset 0 2px 0 var(--accent); }
  .bnav > a:focus-visible, .bnav > button:focus-visible { outline-offset: -3px; border-radius: 0; }

  });
}

  for (const line of SEED_DSL.split('\n')) {
    if (!line.trim()) continue;
    if (line[0] === '@') { sec = line.slice(1).trim(); continue; }
    const [n, u] = line.split('|');
    const it = { name: n, unit: u, section: sec, builtin: true };
    SEED.push(it); SEED_MAP.set(ikey(n), it);
  }
})();

/* Heuristic for ingredients that are not in the library */
function guessSection(name) {
  const n = String(name || '').toLowerCase();
  const has = re => re.test(n);
  if (has(/\bfrozen\b/)) return 'Frozen Foods';
  if (has(/\b(ice cream|sorbet|popsicle)\b/)) return 'Frozen Foods';
  if (has(/\b(canned|can of|jarred|dried|dry|powder|powdered|ground|extract|sauce|broth|stock|bouillon|oil|vinegar|flour|sugar|salt|pepper flakes|black pepper|spice|seasoning|rub|rice|pasta|noodle|beans?|lentil|oats?|cereal|nuts?|almond|walnut|pecan|cashew|peanut|seeds?|syrup|honey|jam|jelly|mustard|ketchup|mayo|mayonnaise|dressing|salsa|olives?|pickle|cracker|chips|granola|cocoa|chocolate|coconut milk|baking|yeast|cornstarch|tortilla|bar|bars|protein|tuna|sardine|broth)\b/)) return 'Grocery';
  if (has(/\b(juice|soda|coffee|tea|wine|beer|kombucha|sparkling|water)\b/)) return 'Beverages';
  if (has(/\b(milk|cheese|butter|yogurt|yoghurt|egg|eggs|cream|kefir|ricotta|cottage|tofu|tempeh)\b/)) return 'Dairy';
  if (has(/\b(chicken|beef|pork|turkey|sausage|bacon|steak|lamb|ham|brisket|ribs?|roast|salmon|cod|tilapia|shrimp|scallop|crab|lobster|trout|halibut|fish|tenderloin|ground)\b/)) return 'Meat & Poultry';
  if (has(/\b(deli|sliced|salami|prosciutto|pepperoni)\b/)) return 'Deli';
  if (has(/\b(bread|bun|buns|roll|rolls|bagel|bagels|pita|naan|muffin|baguette|croissant|ciabatta)\b/)) return 'Bakery';
  if (has(/\b(foil|parchment|wrap|bags?|container|towel|soap|napkin)\b/)) return 'Other';
  if (has(/\b(apple|banana|orange|lemon|lime|berry|berries|grape|melon|mango|peach|pear|plum|onion|garlic|pepper|tomato|potato|carrot|celery|lettuce|spinach|kale|broccoli|cauliflower|cabbage|cucumber|zucchini|squash|mushroom|avocado|herb|basil|cilantro|parsley|ginger|asparagus|beet|radish|corn|pea|greens|fresh)\b/)) return 'Produce';
  return 'Grocery';
}

    const r = getRecipe(rid), base = r.servings || 1, need = planned * hh;

/* ---- auto-plan: pick menus that land closest to your daily calorie + macro targets ---- */
function autoPlan({ rebuild = false, variety = 3, only = 'all' } = {}) {
  const t = getTargets();
  const T = (t && t.kcal) || 2000, pt = t ? t.pct : BODY_TYPES.mesomorph.pct;
  const eaten = state.settings.nutritionMode === 'eaten';
  const slots = activeSlots();
  const days = orderedDays().filter(d => rebuild || !SLOTS.some(s => getSlot(d, s)));
  if (!days.length) return { error: 'Every day already has meals. Choose "Rebuild the whole week" to start over.' };
  const pool = ty => {
    let l = state.recipes.filter(r => r.type === ty);
    if (only === 'prep') { const x = l.filter(r => r.prep); if (x.length) l = x; }
    if (only === 'fav') { const x = l.filter(r => r.fav); if (x.length) l = x; }
    return l;
  };
  const pools = {}; for (const ty of MEAL_TYPES) pools[ty] = pool(ty);
  const usable = slots.filter(s => pools[slotType(s)].length);
  const missing = slots.filter(s => !pools[slotType(s)].length && s !== 'Snacks');
  if (!usable.length) return { error: 'Add some recipes first, or load the demo recipes.' };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sizeFor = s => { const n = pools[slotType(s)].length; return Math.min(n, slotType(s) === 'Lunch / Dinner' ? variety + 1 : variety); };
  let best = null;
  const iters = 260, t0 = performance.now();
  for (let it = 0; it < iters; it++) {
    if (it >= 30 && performance.now() - t0 > 150) break;          // stay responsive on slow devices
    const menus = {}; for (const ty of MEAL_TYPES) menus[ty] = shuffle(pools[ty]);
    const menuFor = {};
    for (const s of usable) { const ty = slotType(s); menuFor[s] = menus[ty].slice(0, sizeFor(s)); }
    const used = new Map(); let total = 0; const assign = {};
    for (const day of days) {
      let bestCombo = null;
      const rec = (i, picks, cal, p, c, f) => {
        if (i === usable.length) {
          if (cal <= 0) return;
          const pct = macroPct(p, c, f); if (!pct) return;
          const sc = eaten ? clamp(Math.round((T / cal) / 0.25) * 0.25, 0.5, 3) : 1;
          const calErr = Math.abs(cal * sc - T) / T * 100;
          const macErr = 0.5 * (Math.abs(pct.c - pt.c) + Math.abs(pct.f - pt.f) + Math.abs(pct.p - pt.p));
          const sig = picks.map(x => x ? x.id : '-').join('>');
          const score = calErr + macErr + (used.get(sig) || 0) * 3;
          if (!bestCombo || score < bestCombo.score) bestCombo = { score, picks: picks.slice(), sc, sig, base: calErr + macErr };
          return;
        }
        const s = usable[i], opts = menuFor[s].slice(); if (s === 'Snacks') opts.push(null);
        for (const r of opts) { picks[i] = r; rec(i + 1, picks, cal + (r ? r.cal : 0), p + (r ? r.p : 0), c + (r ? r.c : 0), f + (r ? r.f : 0)); }
      };
      rec(0, [], 0, 0, 0, 0);
      if (!bestCombo) continue;
      used.set(bestCombo.sig, (used.get(bestCombo.sig) || 0) + 1);
      total += bestCombo.base; assign[day] = bestCombo;
    }
    if (!best || total < best.total) best = { total, assign };
  }
  if (!best) return { error: 'Could not build a plan from the current recipes.' };
  for (const day of days) {
    if (rebuild) delete state.plan[day];
    const a = best.assign[day]; if (!a) continue;
    usable.forEach((s, i) => { const r = a.picks[i]; if (r) setSlot(day, s, r.id, eaten ? a.sc : 1); });
  }
  const summary = weekSummary();
  return { ok: true, days: days.length, missing, avg: summary.avg };
}

function donut(pct, { center = '', sub = '', size = 150 } = {}) {
  const C = 2 * Math.PI * 40; let off = 0;
  const segs = MK.map(k => {
    const len = C * (pct[k] || 0) / 100, dash = Math.max(0, len - 2.2);
    const s = `<circle class="seg seg-${k}" cx="50" cy="50" r="40" fill="none" stroke-width="10" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"><title>${MACRO[k].label} ${Math.round(pct[k])}%</title></circle>`;
    off += len; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Macro split: ${MK.map(k => MACRO[k].label + ' ' + Math.round(pct[k]) + '%').join(', ')}"><circle cx="50" cy="50" r="40" fill="none" stroke-width="10" class="track"/>${segs}<text x="50" y="${sub ? 49 : 54}" text-anchor="middle" class="d-main">${esc(center)}</text>${sub ? `<text x="50" y="62" text-anchor="middle" class="d-sub">${esc(sub)}</text>` : ''}</svg>`;
}

/* results panel: BMR, TDEE, calories, macros */
function resultsHTML() {
  const p = state.profile, h = calcHealth(p);

  if (!h) return `<div class="card soft"><h3>Your numbers</h3><p class="muted">Enter your age, height and weight to see your calorie and macro targets. Nothing leaves this device.</p>${macroTargetsOnly()}</div>`;
  const imp = p.unit === 'imperial';
  const dTxt = h.delta === 0 ? 'Maintenance' : (h.delta > 0 ? '+' : '−') + fmtInt(Math.abs(h.delta)) + ' kcal / day';
  return `<div class="card results">
    <div class="kpis"><div class="kpi"><small>BMR</small><b>${fmtInt(h.bmr)}</b><span>kcal at rest</span></div><div class="kpi"><small>Maintenance (TDEE)</small><b>${fmtInt(h.tdee)}</b><span>kcal / day</span></div><div class="kpi hero"><small>Daily target</small><b>${fmtInt(h.kcal)}</b><span>${p.calorieOverride ? 'manual override' : dTxt}</span></div></div>
    ${h.warnings.map(w => `<div class="note warn">${icon('alert')}<span>${esc(w)}</span></div>`).join('')}
    <div class="res-macros">${donut(h.pct, { center: fmtInt(h.kcal), sub: 'kcal / day' })}
      <table class="mtable"><thead><tr><th><span class="sr">Macro</span></th><th>Split</th><th>Grams</th><th>kcal</th></tr></thead><tbody>
      ${MK.map(k => `<tr><th scope="row"><i class="dot m-${k}"></i>${MACRO[k].label}</th><td>${round(h.pct[k], 1)}%</td><td><b>${fmtInt(h.grams[k])} g</b></td><td>${fmtInt(h.kcal * h.pct[k] / 100)}</td></tr>`).join('')}
      </tbody></table></div>
    <p class="muted small health-note">Estimates only, not medical advice. Ask a doctor or registered dietitian before changing your diet, especially if you are pregnant or nursing, have a medical condition, or have a history of disordered eating.</p>
    <details class="fine how"><summary>How is this calculated?</summary><p class="muted small">BMR (calories at rest) comes from the ${p.formula === 'katch' && p.bodyFat > 0 ? 'Katch-McArdle formula: 370 + 21.6 × lean mass in kg' : 'Mifflin-St Jeor formula: 10 × weight (kg) + 6.25 × height (cm) − 5 × age, plus 5 for male, minus 161 for female, or minus 78 for the average'}. Maintenance (TDEE) is BMR × your activity number. Your target adds or subtracts about 1,100 kcal a day for each kg per week of change. Grams follow your split: protein and carbs at 4 kcal per gram, fats at 9. These are population averages. Real needs vary.</p></details>
    <p class="muted small">Protein: ${round(h.gPerKg, 1)} g per kg (${round(h.gPerKg * LB_KG, 2)} g per lb) of body weight. Calories from ${p.formula === 'katch' && p.bodyFat > 0 ? 'Katch-McArdle' : 'Mifflin-St Jeor'} × activity ${p.activity}.</p>
    <label class="fld inline"><span>Manual calorie override <em>optional</em></span><input type="number" min="800" max="10000" step="10" placeholder="${fmtInt(Math.round((h.tdee + h.delta) / 10) * 10)}" value="${p.calorieOverride ?? ''}" data-input="kcalOverride" data-fid="f-kco"></label>
  </div>`;
}
function macroTargetsOnly() { const p = state.profile; return `<div class="res-macros">${donut(p.pct, { center: '', sub: '' , size: 120})}${macroLegend(p.pct)}</div>`; }
function pctEditorHTML() {

VIEWS.home = {

    const auto = featureOn('grocery') ? buildGrocery() : [], left = auto.filter(i => !state.checked[i.key] && !state.have[i.key]).length + state.manual.filter(m => !m.done).length;
    const tiles = [];

    tiles.push(`<a class="tile" href="#/recipes"><small>Recipes</small><b>${state.recipes.length}</b><span>${state.recipes.filter(r => r.fav).length} favorites</span></a>`);

    /* today */
    let todayCard = '';

      const meals = activeSlots().map(s => { const e = getSlot(d, s); const r = e && getRecipe(e.rid); return `<li><span class="slot">${s}</span>${r ? `<a href="#/recipes/${r.id}">${esc(r.name)}</a><span class="muted small">${fmtInt(r.cal * nutMult(e))} kcal</span>` : `<a class="addmeal" href="#/planner">+ Add a meal</a>`}</li>`; }).join('');

    }

    /* checklist */
    const steps = [];
    if (featureOn('health')) steps.push({ t: 'Add your stats and pick a body type', done: profileReady(state.profile), a: '<a class="btn sm" href="#/goals">Set my targets</a>' });
    steps.push({ t: 'Add your recipes', done: state.recipes.length > 0, a: `<button class="btn sm" data-act="newRecipe">${icon('plus')} Add recipe</button> <button class="btn sm" data-act="loadDemo">Load demo recipes</button>` });
    if (featureOn('planner')) steps.push({ t: 'Plan your week', done: plannedCount() > 0, a: '<a class="btn sm" href="#/planner">Plan my week</a>' });
    if (featureOn('grocery')) steps.push({ t: 'Shop from your grocery list', done: plannedCount() > 0 && (auto.length > 0) && Object.keys(state.checked).length > 0, a: '<a class="btn sm" href="#/grocery">See my list</a>' });
    steps.push({ t: 'Save a backup file', done: !!state.settings.lastExport, a: '<button class="btn sm" data-act="backupNow">Save backup now</button>' });
    const doneN = steps.filter(s => s.done).length, nextI = steps.findIndex(s => !s.done), stepsLeft = steps.length - doneN;
    const list = doneN < steps.length ? `<section class="card"><div class="card-head"><h2>Getting started</h2><span class="muted small">${stepsLeft} step${stepsLeft === 1 ? '' : 's'} left</span></div><div class="clbar" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${doneN}" aria-label="Getting started progress"><span style="width:${Math.max(6, Math.round(100 * doneN / steps.length))}%"></span></div><ol class="checklist">${steps.map((s, i) => `<li class="${s.done ? 'done' : i === nextI ? 'next' : ''}"><span class="cbox">${s.done ? icon('check', 'sm') : ''}</span><span class="ct">${s.t}</span><span class="ca">${s.done ? '' : i === nextI ? s.a.replace('class="btn sm"', 'class="btn sm primary"') : s.a}</span></li>`).join('')}</ol></section>` : '';

    /* best-fit picks */
    let picks = '';
    if (t && state.recipes.length) {
      const best = state.recipes.map(r => ({ r, fit: recipeNutri(r).fit })).filter(x => x.fit !== null).sort((a, b) => b.fit - a.fit).slice(0, 4);
      picks = `<section class="card"><div class="card-head"><h2>Best fits for your macros</h2></div><ul class="picks">${best.map(({ r, fit }) => `<li><a href="#/recipes/${r.id}">${esc(r.name)}</a><span class="muted small">${r.type}</span>${fitChip(fit)}</li>`).join('')}</ul></section>`;

function filteredRecipes() {
  const f = ui.recipes, q = f.q.trim().toLowerCase(), health = featureOn('health');
  let l = state.recipes.filter(r => {
    if (f.type !== 'all' && r.type !== f.type) return false;
    if (f.fav && !r.fav) return false;
    if (f.prep && !r.prep) return false;
    if (q && !(r.name.toLowerCase().includes(q) || (r.notes || '').toLowerCase().includes(q) || r.ingredients.some(g => g.item.toLowerCase().includes(q)))) return false;
    return true;
  });
  const fit = r => recipeNutri(r).fit ?? -1;
  const S = { name: (a, b) => a.name.localeCompare(b.name), calAsc: (a, b) => a.cal - b.cal, calDesc: (a, b) => b.cal - a.cal, protein: (a, b) => b.p - a.p, fit: (a, b) => fit(b) - fit(a) || a.name.localeCompare(b.name), updated: (a, b) => String(b.updated).localeCompare(String(a.updated)) || a.name.localeCompare(b.name) };
  l.sort(S[f.sort === 'fit' && !health ? 'name' : f.sort] || S.name);
  return l;
}
/* Recipe list row, always in the same three lines:
   1) name (+ favorite star) ............ fit score
   2) kcal | protein | carbs | fat        (fixed columns, so numbers line up down the list)
   3) meal type · Meal prep · Demo ...... last updated */
function recipeItemHTML(r, sel) {
  const n = recipeNutri(r), health = featureOn('health'), d = fmtDate(r.updated);
  const meta = [`<span>${esc(r.type)}</span>`, r.prep ? `<span class="rprep">${icon('layers', 'sm')}Meal prep</span>` : '', isDemo(r) ? '<span class="rdemo">Demo</span>' : ''].filter(Boolean).join('<span class="sep" aria-hidden="true">·</span>');
  return `<a href="#/recipes/${r.id}" class="ritem${sel === r.id ? ' on' : ''}"${sel === r.id ? ' aria-current="true"' : ''}>
    <div class="rt"><b>${r.fav ? `<span class="fav" role="img" aria-label="Favorite">${icon('star', 'sm fill')}</span>` : ''}${esc(r.name)}</b>${health ? fitChip(n.fit) : ''}</div>
    <div class="rn"><span class="rk"><b>${fmtInt(r.cal)}</b> kcal</span><span><i class="dot m-p"></i><b>${round(r.p)}</b>g P</span><span><i class="dot m-c"></i><b>${round(r.c)}</b>g C</span><span><i class="dot m-f"></i><b>${round(r.f)}</b>g F</span></div>
    <div class="rmeta"><span class="rtags">${meta}</span>${d ? `<time class="upd" datetime="${esc(r.updated)}" title="Last updated ${esc(new Date(r.updated).toLocaleString())}">${d === 'today' || d === 'yesterday' ? 'Updated ' + d : esc(d).replace(/(, \d{4})$/, '<span class="yr">$1</span>')}</time>` : ''}</div></a>`;
}
function recipeListHTML() {
  const l = filteredRecipes(), sel = currentRecipeId();
  if (!l.length) return `<div class="empty small"><p>No recipes match your filters.</p><button class="btn" data-act="clearFilters">Clear filters</button></div>`;
  return l.map(r => recipeItemHTML(r, sel)).join('');
}
function currentRecipeId() {
  if (route.arg && getRecipe(route.arg)) return route.arg;
  if (matchMedia('(min-width: 960px)').matches) { const l = filteredRecipes(); return l.length ? l[0].id : ''; }
  return '';
}

/* "1 1/2 lb chicken breast, cubed"  ->  { qty: 1.5, unit: 'pound', item: 'chicken breast' } */
function parseIngLine(line) {
  let s = String(line).replace(/^[\s•·*\-–]+/, '').trim(); if (!s) return null;
  const numRe = /^((?:\d+\s+\d+\s*\/\s*\d+)|(?:\d+\s*\/\s*\d+)|(?:\d*\.\d+)|(?:\d+)\s*[¼½¾⅓⅔⅛-⅞]|[¼½¾⅓⅔⅛-⅞]|\d+)/;
  let qty = null, m = s.match(numRe);
  if (m) { qty = parseQty(m[1]); s = s.slice(m[0].length).trim(); if (/^(-|–|to)\s*\d/.test(s)) s = s.replace(/^(-|–|to)\s*[\d\s/.¼-¾⅓⅔⅛-⅞]+/, '').trim(); }
  s = s.replace(/^\([^)]*\)\s*/, '').replace(/^\d+(?:\.\d+)?[\s-]*(?:oz|ounce|ounces|lb|lbs|g|ml)\.?[\s-]*(?=(?:cans?|jars?|bags?|packages?|boxes|box|bottles?)\b)/i, '');
  let unit = '';
  const w = s.match(/^(fl\.?\s*oz\.?|[A-Za-z]+\.?)(?=\s|$|\()/);
  if (w) { const cand = normUnit(w[1]); if (UNIT_LIST.includes(cand) && !['as needed', 'to taste'].includes(cand)) { unit = cand; s = s.slice(w[0].length).trim(); } }
  s = s.replace(/^of\s+/i, '');
  let item = s.split(/,| \(/)[0].trim();
  if (/to taste$/i.test(item)) { item = item.replace(/\s*to taste$/i, '').trim(); if (qty === null) unit = 'to taste'; }
  if (!item) return null;
  if (!unit) unit = qty === null ? (unit || 'as needed') : 'each';
  return { item: item.toLowerCase(), qty, unit };
}

document.addEventListener('submit', e => { if (e.target.id === 'rform') { e.preventDefault(); saveRecipeForm(); } });
function saveRecipeForm() {
  const f = $('#rform'), id = f.dataset.id, err = $('#e-err');
  const fail = m => { err.textContent = m; err.hidden = false; };
  const name = $('#e-name').value.trim(); if (!name) return fail('Please give the recipe a name.');
  const dup = recipeByName(name); if (dup && dup.id !== id) return fail('A recipe with that name already exists. Please pick a different name.');
  const servings = num($('#e-serv').value); if (!(servings > 0)) return fail('Servings must be greater than zero.');
  const p = num($('#e-p').value), c = num($('#e-c').value), fat = num($('#e-f').value);
  let cal = numOrNull($('#e-cal').value); if (cal === null) cal = Math.round(atwater(p, c, fat));
  const ingredients = [];
  for (const row of $$('#irows .irow')) {
    const item = $('.i-item', row).value.trim(); if (!item) continue;
    const qty = parseQty($('.i-qty', row).value); let unit = normUnit($('.i-unit', row).value);
    if (qty === null && !['to taste', 'as needed'].includes(unit)) unit = 'as needed';
    if (qty !== null && !unit) unit = 'each';
    ingredients.push({ item: item.toLowerCase(), qty, unit });
  }
  const steps = $('#e-steps').value.split(/\r?\n/).map(s => s.replace(/^\s*(?:step\s*)?\d+[.):]\s*/i, '').trim()).filter(Boolean);
  const rec = { updated: new Date().toISOString(), name, type: $('#e-type').value, servings, cal: Math.max(0, cal), p, c, f: fat, prep: $('#e-prep').checked, fav: $('#e-fav').checked, ingredients, steps, notes: $('#e-notes').value.trim() };
  let target;
  if (id) { target = getRecipe(id); adoptDemo(target); Object.assign(target, rec); } else { target = { id: uid('r'), ...rec }; state.recipes.push(target); }
  for (const g of ingredients) ensureIngredient(g.item, g.unit);
  refreshIngLists(); saveSoon(); closeDialog(); toast(id ? 'Recipe updated' : 'Recipe saved', 'ok'); go('#/recipes/' + target.id); rerender();
}

}
function deltaText(v, unit = '', d = 0) { return fmtSigned(v, d) + unit; }

function weekChart(per, t) {
  const W = 700, H = 210, L = 40, B = 28, top = 18, bw = 52, gap = (W - L - 10 - bw * 7) / 6;
  const vals = per.map(x => x.T.cal), rawMax = Math.max(...vals, t && t.kcal ? t.kcal * 1.1 : 0, 1000) * 1.08, max = Math.ceil(rawMax / 500) * 500;
  const y = v => top + (H - top - B) * (1 - v / max);
  const ticks = [0, max / 2, max];
  const bars = per.map((x, i) => {
    const bx = L + i * (bw + gap), v = x.T.cal, by = y(v), bh = H - B - by;
    const tip = x.T.n ? `${x.day}: ${fmtInt(v)} kcal${x.T.pct ? ` · P ${Math.round(x.T.pct.p)}% C ${Math.round(x.T.pct.c)}% F ${Math.round(x.T.pct.f)}%` : ''}` : `${x.day}: nothing planned`;
    return `<g data-tip="${esc(tip)}" tabindex="0" role="img" aria-label="${esc(tip)}"><rect x="${bx}" y="${H - B - Math.max(bh, 0)}" width="${bw}" height="${Math.max(bh, 0)}" rx="4" class="bar ${x.st.k}"/>${x.T.n ? `<text x="${bx + bw / 2}" y="${by - 5}" text-anchor="middle" class="ax val">${fmtInt(v)}</text>` : `<text x="${bx + bw / 2}" y="${H - B - 6}" text-anchor="middle" class="ax">–</text>`}<text x="${bx + bw / 2}" y="${H - 8}" text-anchor="middle" class="ax">${x.day.slice(0, 3)}</text></g>`;
  }).join('');
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${fmtInt(v)}</text>`).join('');
  const tl = t && t.kcal ? `<line x1="${L}" x2="${W - 6}" y1="${y(t.kcal)}" y2="${y(t.kcal)}" class="tline"/>` : '';
  return `<div><svg class="wchart" viewBox="0 0 ${W} ${H}" role="group" aria-label="Calories planned per day">${grid}${bars}${tl}</svg><p class="chartkey"><span><i class="swatch"></i>Calories planned</span>${t && t.kcal ? `<span><i class="dash"></i>Target ${fmtInt(t.kcal)} kcal</span>` : ''}</p></div>`;
}

function ingredientRowsHTML() {
  const q = ui.ingQ.trim().toLowerCase(), sec = ui.ingSec, use = ingUsage();
  let list = allIngredients().filter(i => (sec === 'all' || i.section === sec) && (!q || i.name.toLowerCase().includes(q)));
  const total = list.length; list = list.slice(0, ui.ingLimit);
  const secOpts = s => optionsHTML(state.settings.sectionOrder.map(x => [x, x]), s);
  const unitOpts = u => { const l = UNIT_LIST.includes(u) ? UNIT_LIST : UNIT_LIST.concat([u]); return optionsHTML(l.map(x => [x, x]), u); };
  const rows = list.map(i => { const n = use.get(ikey(i.name)) || 0; return `<tr><td><b>${esc(cap(i.name))}</b>${i.custom ? ' <span class="chip">Custom</span>' : i.overridden ? ' <span class="chip">Edited</span>' : ''}</td>

}

const isDemo = r => String(r.id).startsWith('demo_');
function loadDemo(silent) {
  let added = 0;
  for (const d of DEMO_RECIPES) {
    if (state.recipes.some(r => r.id === d.id || r.name.toLowerCase() === d.name.toLowerCase())) continue;
    state.recipes.push({ id: d.id, name: d.name, type: d.type, servings: d.servings, cal: d.cal, p: d.p, c: d.c, f: d.f, prep: d.prep, fav: d.fav, ingredients: d.ingredients.map(([item, qty, unit]) => ({ item, qty, unit })), steps: d.steps.slice(), notes: d.tip || '', updated: DEMO_UPDATED });

/* ==========================================================================
   Backups: JSON (full, preferred) and CSV, saved where you choose.
   - Chromium desktop browsers: File System Access API. The file handle is kept in
     IndexedDB (handles cannot go in localStorage) so "Save backup now" overwrites
     the same file in one click. Browsers only ever expose the file NAME, never its folder.
   - Everywhere else (Firefox, Safari, phones): a normal dated download to Downloads.
   ========================================================================== */
const BACKUP_FORMAT = 'mbmealprep-backup';
const FS_OK = typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
const SAVE_KEYS = IS_MAC ? '⌘S' : 'Ctrl+S';
const backupFile = { json: null, csv: null };

function idbHandles(mode, fn) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('IndexedDB unavailable')); return; }
    const rq = indexedDB.open('mbmealprep', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('handles');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const db = rq.result; let r;
      try { const tx = db.transaction('handles', mode); r = fn(tx.objectStore('handles'));
        tx.oncomplete = () => { db.close(); res(r && r.result); }; tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
      } catch (e) { db.close(); rej(e); }
    };
  });
}
const handleGet = k => idbHandles('readonly', st => st.get(k)).catch(() => null);
const handleSet = (k, h) => idbHandles('readwrite', st => st.put(h, k)).catch(() => { });
async function loadBackupHandles() {
  if (!FS_OK) return;
  backupFile.json = (await handleGet('json')) || null; backupFile.csv = (await handleGet('csv')) || null;
  renderBackupUI(); if (route.name === 'data') rerender();
}

function backupJSON() {
  return JSON.stringify({ app: APP.name, format: BACKUP_FORMAT, version: 1, appVersion: APP.version, exported: new Date().toISOString(), data: state }, null, 2);
}
/* A JSON backup becomes the same records a CSV would, so merge / replace / preview work identically. */
function jsonToRecords(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return { records: [], error: 'That file is not valid JSON. Choose a .json backup made by this app, or a CSV.' }; }
  const data = o && typeof o === 'object' && !Array.isArray(o) ? (o.format === BACKUP_FORMAT && o.data && typeof o.data === 'object' ? o.data : o) : null;
  if (!data || !['recipes', 'settings', 'profile', 'setup', 'plan'].some(k => Object.prototype.hasOwnProperty.call(data, k))) return { records: [], error: 'That JSON file is not an mbmealprep.online backup.' };
  const st = defaultState(); mergeInto(st, data);
  for (const k of ['plan', 'checked', 'have']) if (data[k] && typeof data[k] === 'object' && !Array.isArray(data[k])) st[k] = data[k];
  sanitizeState(st);
  const records = stateToRows(st).map(r => { const x = {}; for (const c of CSV_COLS) x[c] = r[c] === null || r[c] === undefined ? '' : String(r[c]); return x; });
  return { records, error: null };
}

/* ---- "backed up last" status (shared pattern across the app family) ---- */
function agoText(t) {
  const sec = (Date.now() - t) / 1000;
  if (sec < 60) return 'just now'; if (sec < 3600) return Math.floor(sec / 60) + ' min ago'; if (sec < 86400) return Math.floor(sec / 3600) + ' h ago';
  const d = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(t).setHours(0, 0, 0, 0)) / 864e5);
  return d <= 1 ? 'yesterday' : d + ' days ago';
}
function backupInfo() {
  const le = state.settings.lastExport, t = le ? new Date(le).getTime() : 0;
  const hasData = state.recipes.some(r => !isDemo(r)) || state.manual.length > 0 || Object.keys(state.plan).length > 0;
  const warn = t ? Date.now() - t > 7 * 864e5 : hasData;
  return { t, hasData, warn, label: t ? 'Backed up ' + agoText(t) : 'Never backed up', exact: t ? new Date(t).toLocaleString() : '' };
}
function backupWhereHTML() {
  if (!FS_OK) return 'This browser saves backups to your Downloads folder.';
  const h = backupFile.json;
  return h ? `Saves to <b>${esc(h.name)}</b> in the folder you chose. <button type="button" class="linkbtn" data-act="exportJson">Change location…</button>`
    : 'The first save asks where to put the file. After that, one click updates it.';
}
function renderBackupUI() {
  if (!state) return;
  const b = backupInfo(), chip = $('#bkChip'), dm = $('#dataMenu');
  if (chip) {
    chip.hidden = !state.setup.done;
    chip.classList.toggle('warn', b.warn);
    chip.innerHTML = `${icon(b.warn ? 'alert' : 'shield', 'sm')}<span>${esc(b.label)}</span>`;
    chip.title = (b.t ? `Last backup ${b.exact}. ` : '') + `Click to save a backup now (${SAVE_KEYS}).`;
    chip.setAttribute('aria-label', `${b.label}. Save backup now`);
  }
  if (dm) {
    dm.classList.toggle('warn', b.warn); dm.classList.toggle('on', route.name === 'data');
    const sum = dm.querySelector('summary'); if (sum) sum.setAttribute('aria-label', `Data: back up, export or import. ${b.label}`);
    const body = $('#dataMenuBody');
    if (body) body.innerHTML = `<button class="btn primary" data-act="backupNow">${icon('save')}<span>Save backup now</span><kbd>${SAVE_KEYS}</kbd></button>
      <button class="btn ghost" data-act="exportJson">${icon('download')}<span>Export All (JSON)…</span></button>
      <button class="btn ghost" data-act="importBackup">${icon('upload')}<span>Import Backup (JSON or CSV)…</span></button>
      <button class="btn ghost" data-act="exportCsv">${icon('download')}<span>Export All (CSV)…</span></button>
      <div class="dm-foot"><p class="${b.warn ? 'bk-warn' : ''}">${icon(b.warn ? 'alert' : 'shield', 'sm')}<span>${esc(b.label)}${b.t ? ` · ${esc(new Date(b.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))}` : ''}</span></p><p>${backupWhereHTML()}</p><a href="#/data" class="dm-more">More data tools: merge or replace, demo recipes, erase</a></div>`;
  }
}
const closeMenus = () => $$('details.moremenu[open]').forEach(d => { d.open = false; });
function markBackedUp() { state.settings.lastExport = new Date().toISOString(); saveNow(); rerender(); }

async function writeHandle(h, text) { const w = await h.createWritable(); await w.write(text); await w.close(); }
async function canWrite(h) {
  try { const o = { mode: 'readwrite' }; if ((await h.queryPermission(o)) === 'granted') return true; return (await h.requestPermission(o)) === 'granted'; }
  catch (e) { return false; }
}
async function pickSaveFile(kind) {
  const json = kind === 'json';
  const opts = { suggestedName: (backupFile[kind] && backupFile[kind].name) || (json ? 'mbmealprep-backup.json' : 'mbmealprep-backup.csv'),
    types: [json ? { description: 'JSON backup', accept: { 'application/json': ['.json'] } } : { description: 'CSV spreadsheet', accept: { 'text/csv': ['.csv'] } }],
    startIn: backupFile[kind] || backupFile.json || backupFile.csv || 'documents' };
  try { return await window.showSaveFilePicker(opts); }
  catch (e) { if (e && e.name === 'AbortError') return null; delete opts.startIn; return await window.showSaveFilePicker(opts); }   // saved folder may be gone
}
async function exportTo(kind) {
  closeMenus();
  const json = kind === 'json', text = json ? backupJSON() : exportCSV(), what = json ? 'Backup' : 'CSV';
  if (!FS_OK) { downloadText(json ? `mbmealprep-backup-${today()}.json` : `mbmealprep-${today()}.csv`, text, json ? 'application/json' : 'text/csv;charset=utf-8'); markBackedUp(); toast(`${what} downloaded to your Downloads folder`, 'ok'); return; }
  try {
    const h = await pickSaveFile(kind); if (!h) return;
    await writeHandle(h, text); backupFile[kind] = h; handleSet(kind, h); markBackedUp(); toast(`${what} saved to ${h.name}`, 'ok');
  } catch (e) { toast(`Could not save the ${what.toLowerCase()}. Try again or pick another folder.`, 'err'); }
}
ACTIONS.exportJson = () => exportTo('json');
ACTIONS.exportCsv = () => exportTo('csv');
ACTIONS.backupNow = async () => {
  closeMenus();
  const h = backupFile.json;
  if (!FS_OK || !h) return exportTo('json');                       // first time: ask where (or download)
  try {
    if (!(await canWrite(h))) { toast('Save needs permission to update your backup file.', '', { label: 'Choose file', fn: () => exportTo('json') }); return; }
    await writeHandle(h, backupJSON()); markBackedUp(); toast(`Backup saved to ${h.name}`, 'ok');
  } catch (e) { toast(`Could not update ${h.name}. It may have been moved or deleted.`, 'err', { label: 'Choose location', fn: () => exportTo('json') }); }
};
document.addEventListener('keydown', e => {                          // Ctrl/Cmd+S = Save backup now
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || (e.key !== 's' && e.key !== 'S')) return;
  e.preventDefault();
  if (state && state.setup.done) ACTIONS.backupNow();
});

/* ---- import: pick a file (opens in the backup folder), then preview on the Data page ---- */
async function pickImportFile() {
  closeMenus();
  if (!FS_OK) { const inp = $('#impAny'); if (inp) { inp.value = ''; inp.click(); } return; }
  const opts = { multiple: false, types: [{ description: 'Backup (JSON or CSV)', accept: { 'application/json': ['.json'], 'text/csv': ['.csv', '.tsv', '.txt'] } }],
    startIn: backupFile.json || backupFile.csv || 'documents' };
  let hs;
  try { hs = await window.showOpenFilePicker(opts); }
  catch (e) {
    if (e && e.name === 'AbortError') return;
    delete opts.startIn;
    try { hs = await window.showOpenFilePicker(opts); } catch (e2) { if (!e2 || e2.name !== 'AbortError') toast('Could not open the file picker.', 'err'); return; }
  }
  try { readImportFile(await hs[0].getFile()); } catch (e) { toast('Could not read that file.', 'err'); }
}
ACTIONS.importBackup = () => pickImportFile();
CHANGES.impAny = el => { if (el.files[0]) readImportFile(el.files[0]); el.value = ''; };
function openImportText(text, name) {
  ui.pendingImport = { text, name };
  if (route.name === 'data') applyPendingImport(); else go('#/data');
}
function applyPendingImport() {
  const p = ui.pendingImport, area = $('#impText'); if (!p || !area) return;
  ui.pendingImport = null; area.value = p.text;
  const nm = $('#impName'); if (nm) { nm.textContent = p.name ? 'File: ' + p.name : ''; nm.hidden = !p.name; }
  updateImportPreview();
  const card = $('#impCard'); if (card) card.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
}

const GROUP_ORDER = ['Recipes', 'Pages', 'Actions', 'Meal plan', 'Grocery list', 'Ingredients', 'Help & info'], GROUP_CAP = { Recipes: 8, Pages: 8, Actions: 5, 'Meal plan': 4, 'Grocery list': 5, Ingredients: 6, 'Help & info': 5 };
function runSearch(q, docs) {

function recipeSheetHTML(r, opts, mult) {
  const mode = opts.mode === 'color' ? 'color' : 'bw', m = mult || 1, n = recipeNutri(r), url = safeUrl(r.notes), note = (r.notes || '').trim();
  const ing = r.ingredients.map(g => `<li>${opts.checks ? '<span class="box" aria-hidden="true"></span>' : ''}<span class="q">${esc(g.qty === null ? fmtAmount(null, g.unit) : fmtAmount(g.qty * m, g.unit))}</span> <span>${esc(cap(g.item))}</span></li>`).join('');
  const nutri = opts.nutrition ? `<div class="ps-nutri"><span class="k">Per serving</span><b>${fmtInt(r.cal)}</b> kcal<span class="sep">·</span><i class="d d-p"></i>Protein <b>${round(r.p, 1)} g</b><span class="sep">·</span><i class="d d-c"></i>Carbs <b>${round(r.c, 1)} g</b><span class="sep">·</span><i class="d d-f"></i>Fat <b>${round(r.f, 1)} g</b>${n.pct ? `<span class="sep">·</span><span class="split">${Math.round(n.pct.p)}P / ${Math.round(n.pct.c)}C / ${Math.round(n.pct.f)}F %</span>` : ''}</div>` : '';
  const yields = `Makes ${fmtQty(r.servings * m)} ${r.servings * m === 1 ? 'serving' : 'servings'}${m !== 1 ? ` (recipe × ${fmtQty(m)})` : ''}`;
  return `<article class="ps ${mode}${opts.large ? ' lg' : ''}">
    <header><h1>${esc(r.name)}</h1><p class="ps-meta">${esc(r.type)} · ${yields}${r.prep ? ' · Meal-prep friendly' : ''}${isDemo(r) ? ' · Demo recipe' : ''}</p></header>
    ${nutri}
    <div class="ps-cols"><section class="ps-ing"><h2>Ingredients</h2>${ing ? `<ul>${ing}</ul>` : '<p>No ingredients listed.</p>'}</section>
      <section class="ps-steps"><h2>Instructions</h2>${r.steps.length ? `<ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '<p>No steps listed.</p>'}</section></div>
    ${opts.notes && note ? `<section class="ps-notes"><h2>Notes &amp; source</h2><p>${esc(note)}</p></section>` : ''}
    <div class="ps-foot"><span>${esc(APP.name)}</span><span>Recipe last updated ${esc(fmtDate(r.updated, true, true))}</span><span>Printed ${esc(new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }))}</span></div>
  </article>`;
}

/* Measure the sheet off-screen at page width and pick the largest text size that fits on ONE page. */
const PAGE_H = 9.5 * 96;   // usable page height in CSS px (Letter, after margins, with a little slack)
function fitToPage(html, large) {
  const probe = document.createElement('div'); probe.className = 'ps-probe'; probe.innerHTML = html; document.body.appendChild(probe);
  const ps = probe.firstElementChild; let size = large ? 13.5 : 11.5;
  for (; size > 7.5; size -= 0.5) { ps.style.setProperty('--ps-fs', size + 'pt'); if (ps.offsetHeight <= PAGE_H) break; }
  size = Math.max(size, 7.5); probe.remove(); return size;
}
function preparePrint() {
  const id = printJob.id || (route.name === 'recipes' ? currentRecipeId() : '');
  const r = id && getRecipe(id), sheet = $('#printSheet');
  if (!r || !sheet) return;
  const html = recipeSheetHTML(r, printOpts, ui.mult[r.id] || 1), size = fitToPage(html, printOpts.large);
  sheet.innerHTML = html; sheet.firstElementChild.style.setProperty('--ps-fs', size + 'pt');
  document.body.classList.add('printing-recipe');
  printJob.restoreTitle = document.title; document.title = `${r.name} · ${APP.name}`;
}
function finishPrint() {
  document.body.classList.remove('printing-recipe'); printJob.id = '';
  const sheet = $('#printSheet'); if (sheet) sheet.innerHTML = '';
  if (printJob.restoreTitle) { document.title = printJob.restoreTitle; printJob.restoreTitle = ''; }
}
window.addEventListener('beforeprint', () => { if (!document.body.classList.contains('printing-recipe')) preparePrint(); });
window.addEventListener('afterprint', finishPrint);

ACTIONS.printRecipe = el => {
  const r = getRecipe(el.dataset.id); if (!r) return;
  const m = ui.mult[r.id] || 1, o = printOpts; o.mode = state.settings.printMode === 'color' ? 'color' : 'bw';
  const dlg = openDialog(`<form method="dialog" class="dlg-body" id="printForm" data-id="${r.id}"><div class="dlg-head"><h3>Print recipe</h3><button type="button" class="btn icon ghost sm" data-act="closeDlg" aria-label="Close">${icon('x')}</button></div>
    <p class="muted"><b>${esc(r.name)}</b>${m !== 1 ? ` · scaled ×${fmtQty(m)} (${fmtQty(r.servings * m)} servings)` : ''}. One clean page with no menus or buttons. Long recipes shrink to fit.</p>
    <fieldset class="printmode"><legend>Ink</legend><label class="check"><input type="radio" name="poMode" value="bw" ${o.mode === 'bw' ? 'checked' : ''}> Black &amp; white <span class="muted small">(best for laser printers and photocopies)</span></label><label class="check"><input type="radio" name="poMode" value="color" ${o.mode === 'color' ? 'checked' : ''}> Color <span class="muted small">(blue headings and macro colors)</span></label></fieldset>
    <div class="printopts">
      <label class="check"><input type="checkbox" id="po-large" ${o.large ? 'checked' : ''}> Large, easy-to-read text</label>
      <label class="check"><input type="checkbox" id="po-checks" ${o.checks ? 'checked' : ''}> Tick boxes beside ingredients</label>
      <label class="check"><input type="checkbox" id="po-nutri" ${o.nutrition ? 'checked' : ''}> Show nutrition per serving</label>
      <label class="check"><input type="checkbox" id="po-notes" ${o.notes ? 'checked' : ''}> Include notes &amp; source</label></div>
    <p class="muted small">To keep a PDF, choose <b>Save as PDF</b> as the destination in the print window.</p>
    <div class="dlg-actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="print" autofocus>${icon('printer')} Print / save PDF</button></div></form>`);
  dlg.onclose = () => {
    const go = dlg.returnValue === 'print'; dlg.innerHTML = '';
    if (!go) return;
    printJob.id = r.id;
    setTimeout(() => window.print(), 60);        // let the dialog finish closing so it is not captured
  };
  dlg.returnValue = '';
};
document.addEventListener('change', e => {
  const map = { 'po-large': 'large', 'po-checks': 'checks', 'po-nutri': 'nutrition', 'po-notes': 'notes' };
  if (map[e.target.id]) printOpts[map[e.target.id]] = e.target.checked;
  if (e.target.name === 'poMode') { printOpts.mode = e.target.value; state.settings.printMode = e.target.value; saveSoon(); }
});

/* ==========================================================================
   Boot
   ========================================================================== */
function boot() {
  try { localStorage.setItem('__pp_test', '1'); localStorage.removeItem('__pp_test'); } catch (e) { storageOK = false; }
  state = loadState();
  invalidatePantry(); applyTheme(); refreshIngLists();
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  const sb = $('#setupBtn'); if (sb) sb.innerHTML = icon('sliders') + ' Setup';
  const sr = $('#searchBtn'); if (sr) sr.innerHTML = icon('search') + '<span>Search</span><kbd>/</kbd>';
  const tt = $('#toTop'); if (tt) tt.innerHTML = icon('up');
  const bl = $('.brand .logo'); if (bl) bl.outerHTML = logo(28);
  const di = $('#dataMenu .dm-ic'); if (di) di.outerHTML = icon('db');
  const fu = $('#ftUpdated'); if (fu) { fu.textContent = new Date(APP.released + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); fu.dateTime = APP.released; }
  loadBackupHandles();
  setInterval(renderBackupUI, 60000);                                   // keep "Backed up 5 min ago" current
  setMenu(false); showNotice();
  parseRoute(); renderApp(true);

}

/* If saved data or a screen fails badly, show a plain recovery screen instead of a blank page.
   Nothing about the error is shown to the user beyond a generic message. */
function showFatal() {
  const v = document.getElementById('view'); if (!v) return;
  v.innerHTML = '<div class="empty"><h2>Something went wrong</h2><p>The app could not load your saved data. Your data is still in this browser. You can download a raw copy first, then reset the app to start fresh.</p>' +
    '<div class="row center"><button class="btn" data-act="fatalDownload">Download my saved data</button><button class="btn danger" data-act="fatalReset">Reset the app</button></div></div>';
}
ACTIONS.fatalDownload = () => { let raw = ''; try { raw = localStorage.getItem(LS_KEY) || ''; } catch (e) { } downloadText('mbmealprep-saved-data.json', raw, 'application/json'); };
ACTIONS.fatalReset = () => { try { state = defaultState(); saveNow(); } catch (e) { } location.reload(); };
let errToastAt = 0;
const softFail = () => { const t = Date.now(); if (t - errToastAt > 5000) { errToastAt = t; try { toast('Something went wrong. Reload the page. Your data is saved in this browser.', 'err'); } catch (e) { } } };
window.addEventListener('error', softFail);
window.addEventListener('unhandledrejection', softFail);
try { boot(); } catch (e) { showFatal(); }

</script>
</body>
